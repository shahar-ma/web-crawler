services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?required}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: crawler
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?required}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/src/UrlCrawler.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CrawlerDb: "Server=sqlserver,1433;Database=UrlCrawler;User Id=sa;Password=${MSSQL_SA_PASSWORD:?required};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Uri: "amqp://crawler:${RABBITMQ_PASSWORD:?required}@rabbitmq:5672/"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/src/UrlCrawler.Worker/Dockerfile
    environment:
      ConnectionStrings__CrawlerDb: "Server=sqlserver,1433;Database=UrlCrawler;User Id=sa;Password=${MSSQL_SA_PASSWORD:?required};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Uri: "amqp://crawler:${RABBITMQ_PASSWORD:?required}@rabbitmq:5672/"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started

volumes:
  sqlserver-data:
  rabbitmq-data:
